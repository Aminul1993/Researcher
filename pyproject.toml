# Tool configuration only; the app is not packaged. Runtime dependencies
# live in requirements.txt and are pinned in requirements.lock.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["agents", "app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear and pyupgrade.
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["app.py", "agents", "tests"]
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
